<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Sync | Hosted Live on GitHub Pages</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
            --primary: #06b6d4;
            --primary-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg-bg: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --bot-msg-bg: rgba(30, 41, 59, 0.95);
            --success-color: #10b981;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-glow: 0 8px 32px 0 rgba(6, 182, 212, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.18) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            height: 100vh;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        @media (min-width: 641px) {
            .app-container {
                height: 90vh;
                border-radius: var(--radius-lg);
            }
        }

        /* Header */
        .app-header {
            padding: 18px 24px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border-radius: var(--radius-md);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: #fff;
            box-shadow: var(--shadow-glow);
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--primary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-color);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-quick {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-quick:hover {
            background: rgba(6, 182, 212, 0.2);
            border-color: var(--primary);
            color: #fff;
        }

        /* Chat Area */
        .chat-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar {
            width: 6px;
        }
        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .msg-row {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.bot {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .msg-row.user .avatar {
            background: #3b82f6;
            color: #fff;
        }

        .msg-row.bot .avatar {
            background: var(--primary-gradient);
            color: #fff;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .msg-row.user .msg-bubble {
            background: var(--user-msg-bg);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg-row.bot .msg-bubble {
            background: var(--bot-msg-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
        }

        /* Disease Prediction Cards */
        .predictions-container {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prediction-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
        }

        .pred-header {
            display: flex;
            justify-content: space-between;
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .pred-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .pred-bar-fill {
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        /* Inline Booking Form Card */
        .booking-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-top: 14px;
            box-shadow: var(--shadow-glow);
        }

        .booking-card h3 {
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-control {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn-submit-booking {
            margin-top: 14px;
            width: 100%;
            background: var(--primary-gradient);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-submit-booking:hover {
            opacity: 0.9;
        }

        /* Input Bar */
        .chat-footer {
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 8px 6px 20px;
            align-items: center;
            transition: border-color 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14.5px;
            outline: none;
        }

        .btn-send {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary-gradient);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
            box-shadow: var(--shadow-glow);
        }

        .btn-send:hover {
            transform: scale(1.05);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand-info">
                <div class="brand-logo">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <div class="brand-text">
                    <h1>AI Health Sync</h1>
                    <p><span class="status-dot"></span> Live on GitHub Pages</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-quick" onclick="sendQuickMessage('Check my symptoms')">
                    <i class="fa-solid fa-stethoscope"></i> Check Symptoms
                </button>
                <button class="btn-quick" onclick="sendQuickMessage('I want to book an appointment')">
                    <i class="fa-solid fa-calendar-check"></i> Book Doctor
                </button>
            </div>
        </header>

        <!-- Chat Body -->
        <div class="chat-body" id="chatBody">
            <div class="msg-row bot">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-bubble">
                    Hello! I am your <strong>AI Health Assistant</strong> hosted live on GitHub Pages.<br>
                    Describe your symptoms (e.g., <em>"I have a fever, dry cough, and loss of taste"</em>) or request to schedule a doctor consultation.
                </div>
            </div>
        </div>

        <!-- Chat Input Footer -->
        <footer class="chat-footer">
            <div class="input-wrapper">
                <input type="text" id="userInput" class="chat-input" placeholder="Describe your symptoms or ask a question..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- Client-side AI Engine for GitHub Pages -->
    <script>
        // Knowledge Base for GitHub Pages Live Execution
        const SYMPTOMS_DB = [
            "fever", "dry cough", "cough", "loss of taste", "loss of smell", "headache",
            "chest pain", "dizziness", "loss of balance", "itching", "skin rash",
            "nodal skin eruptions", "joint pain", "swelling joints", "stiff neck",
            "stomach pain", "acidity", "vomiting", "nausea", "chills", "sweating",
            "shortness of breath", "breathlessness", "fatigue", "sore throat"
        ];

        const DISEASE_RULES = [
            { disease: "COVID-19", symptoms: ["fever", "dry cough", "loss of taste", "loss of smell", "shortness of breath"] },
            { disease: "Fungal infection", symptoms: ["itching", "skin rash", "nodal skin eruptions"] },
            { disease: "Hypertension", symptoms: ["headache", "chest pain", "dizziness", "loss of balance"] },
            { disease: "Arthritis", symptoms: ["joint pain", "swelling joints", "stiff neck"] },
            { disease: "Common Cold", symptoms: ["cough", "fever", "sore throat", "chills"] },
            { disease: "Bronchial Asthma", symptoms: ["breathlessness", "cough", "fatigue"] },
            { disease: "Gastroenteritis", symptoms: ["vomiting", "stomach pain", "nausea"] },
            { disease: "Migraine", symptoms: ["headache", "nausea", "acidity"] },
            { disease: "Malaria", symptoms: ["chills", "high fever", "sweating", "vomiting"] }
        ];

        const DOCTORS = {
            "General Physician": "Dr. Sarah Jenkins",
            "Cardiologist": "Dr. Rajesh Sharma",
            "Dermatologist": "Dr. Elena Rostova",
            "Neurologist": "Dr. Marcus Vance",
            "Pediatrician": "Dr. Aisha Patel",
            "Orthopedic": "Dr. David Kim",
            "ENT Specialist": "Dr. Sophia Martinez",
            "Gastroenterologist": "Dr. Robert Chen"
        };

        const chatBody = document.getElementById('chatBody');
        const userInput = document.getElementById('userInput');

        function appendMessage(sender, text, extraHtml = '') {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const msgRow = document.createElement('div');
            msgRow.className = `msg-row ${sender}`;
            const avatarIcon = sender === 'user' ? 'fa-user' : 'fa-robot';
            
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formattedText = formattedText.replace(/\n/g, '<br>');

            msgRow.innerHTML = `
                <div class="avatar"><i class="fa-solid ${avatarIcon}"></i></div>
                <div>
                    <div class="msg-bubble">
                        ${formattedText}
                        ${extraHtml}
                    </div>
                    <div class="msg-time">${timeStr}</div>
                </div>
            `;
            chatBody.appendChild(msgRow);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTypingIndicator() {
            const typingRow = document.createElement('div');
            typingRow.className = 'msg-row bot';
            typingRow.id = 'typingIndicator';
            typingRow.innerHTML = `
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-bubble">
                    <div class="typing-indicator">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>
                </div>
            `;
            chatBody.appendChild(typingRow);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function sendQuickMessage(msg) {
            userInput.value = msg;
            sendMessage();
        }

        // Fuzzy symptom extraction
        function extractSymptoms(text) {
            const cleanText = text.toLowerCase();
            const found = [];
            SYMPTOMS_DB.forEach(s => {
                if (cleanText.includes(s)) found.push(s);
            });
            // Handle typos like 'fevr' or 'coug'
            if (found.length === 0) {
                if (cleanText.includes('fevr')) found.push('fever');
                if (cleanText.includes('coug')) found.push('cough');
                if (cleanText.includes('headach')) found.push('headache');
            }
            return found;
        }

        // Disease prediction engine
        function predictDiseases(extractedSymptoms) {
            if (extractedSymptoms.length === 0) return [];
            
            const scores = DISEASE_RULES.map(rule => {
                let matches = 0;
                extractedSymptoms.forEach(s => {
                    if (rule.symptoms.includes(s)) matches++;
                });
                const prob = Math.min(Math.round((matches / Math.max(rule.symptoms.length, 1)) * 95), 98);
                return { disease: rule.disease, probability: Math.max(prob, 10) };
            });

            scores.sort((a, b) => b.probability - a.probability);
            return scores.slice(0, 3);
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            showTypingIndicator();

            setTimeout(() => {
                removeTypingIndicator();
                const lowerText = text.toLowerCase();

                if (lowerText.includes('book') || lowerText.includes('appointment') || lowerText.includes('doctor')) {
                    appendMessage('bot', 'Certainly! I can help you schedule a medical consultation. Please select your preferred specialist and fill out the booking form below.', renderBookingForm());
                } else if (lowerText.includes('hi') || lowerText.includes('hello') || lowerText.includes('hey')) {
                    appendMessage('bot', 'Hello! Welcome to AI Health Sync. How can I assist you with your health today?');
                } else if (lowerText.includes('bye') || lowerText.includes('thanks') || lowerText.includes('thank')) {
                    appendMessage('bot', 'Thank you for using AI Health Sync. Take care and stay healthy!');
                } else {
                    const symptoms = extractSymptoms(text);
                    if (symptoms.length > 0) {
                        const predictions = predictDiseases(symptoms);
                        let predictionsHtml = '<div class="predictions-container">';
                        predictions.forEach(p => {
                            predictionsHtml += `
                                <div class="prediction-card">
                                    <div class="pred-header">
                                        <span>${p.disease}</span>
                                        <span>${p.probability}%</span>
                                    </div>
                                    <div class="pred-bar-bg">
                                        <div class="pred-bar-fill" style="width: ${p.probability}%"></div>
                                    </div>
                                </div>
                            `;
                        });
                        predictionsHtml += '</div>';

                        const top = predictions[0];
                        const resp = `Based on your reported symptoms (${symptoms.join(', ')}), the top potential diagnosis is **${top.disease}** (${top.probability}% confidence).\n\nWould you like to book an appointment with a specialist for further medical evaluation?`;
                        appendMessage('bot', resp, predictionsHtml);
                    } else {
                        appendMessage('bot', "I'm here to help analyze your symptoms or assist in booking a doctor. Could you describe how you are feeling?");
                    }
                }
            }, 500);
        }

        function renderBookingForm() {
            return `
                <div class="booking-card">
                    <h3><i class="fa-solid fa-calendar-plus"></i> Schedule Doctor Appointment</h3>
                    <form onsubmit="submitBooking(event)">
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label>Patient Full Name</label>
                                <input type="text" id="patientName" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div class="form-group">
                                <label>Specialization</label>
                                <select id="specialization" class="form-control" required>
                                    <option value="General Physician">General Physician</option>
                                    <option value="Cardiologist">Cardiologist</option>
                                    <option value="Dermatologist">Dermatologist</option>
                                    <option value="Neurologist">Neurologist</option>
                                    <option value="Pediatrician">Pediatrician</option>
                                    <option value="Orthopedic">Orthopedic</option>
                                    <option value="ENT Specialist">ENT Specialist</option>
                                    <option value="Gastroenterologist">Gastroenterologist</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Preferred Date</label>
                                <input type="date" id="apptDate" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Preferred Time Slot</label>
                                <select id="apptTime" class="form-control" required>
                                    <option value="10:00 AM">10:00 AM</option>
                                    <option value="11:30 AM">11:30 AM</option>
                                    <option value="02:00 PM">02:00 PM</option>
                                    <option value="04:30 PM">04:30 PM</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Contact Number</label>
                                <input type="tel" id="contact" class="form-control" placeholder="+1-555-0199" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-submit-booking">Confirm & Book Appointment</button>
                    </form>
                </div>
            `;
        }

        function submitBooking(event) {
            event.preventDefault();
            const name = document.getElementById('patientName').value.trim();
            const spec = document.getElementById('specialization').value;
            const date = document.getElementById('apptDate').value;
            const time = document.getElementById('apptTime').value;
            const docName = DOCTORS[spec] || "Dr. Sarah Jenkins";
            const bookingId = Math.floor(1000 + Math.random() * 9000);

            showTypingIndicator();
            setTimeout(() => {
                removeTypingIndicator();
                const confirmMsg = `✅ **Appointment Confirmed!**\n• Booking ID: #${bookingId}\n• Patient: ${name}\n• Specialist: ${docName} (${spec})\n• Date & Time: ${date} at ${time}`;
                appendMessage('bot', confirmMsg);
            }, 600);
        }
    </script>
</body>
</html>
